<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A"/>
      <stop offset="50%" style="stop-color:#12172B"/>
      <stop offset="100%" style="stop-color:#0D0A1A"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F8CFF"/>
      <stop offset="100%" style="stop-color:#9B59B6"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#26C6A0"/>
      <stop offset="100%" style="stop-color:#66BB6A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="80" x2="1280" y2="80" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="#4F8CFF" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="#4F8CFF" stroke-width="1"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="150" cy="100" r="120" fill="#4F8CFF" opacity="0.05"/>
  <circle cx="1130" cy="540" r="150" fill="#9B59B6" opacity="0.05"/>
  <circle cx="1100" cy="120" r="80" fill="#26C6A0" opacity="0.04"/>

  <!-- Keyboard icon (simplified) -->
  <g transform="translate(160, 380)" opacity="0.15">
    <rect x="0" y="0" width="180" height="60" rx="8" fill="none" stroke="#4F8CFF" stroke-width="2"/>
    <line x1="15" y1="20" x2="35" y2="20" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="42" y1="20" x2="62" y2="20" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="69" y1="20" x2="89" y2="20" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="96" y1="20" x2="116" y2="20" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="123" y1="20" x2="143" y2="20" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="150" y1="20" x2="165" y2="20" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="40" x2="55" y2="40" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="62" y1="40" x2="97" y2="40" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="104" y1="40" x2="139" y2="40" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="146" y1="40" x2="160" y2="40" stroke="#4F8CFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Logo icon -->
  <g transform="translate(80, 90)">
    <rect x="0" y="0" width="96" height="96" rx="20" fill="url(#accent1)" filter="url(#glow)"/>
    <text x="48" y="65" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="middle">T</text>
    <rect x="22" y="50" width="52" height="4" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Title -->
  <text x="200" y="120" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#E8EDF5">
    Typo<tspan fill="url(#accent1)">Master</tspan>
  </text>

  <!-- Subtitle -->
  <text x="200" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#8E98B3" font-weight="400">
    أتقن الطباعة — Master Your Typing
  </text>

  <!-- Feature boxes -->
  <g transform="translate(100, 240)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#1A2140" opacity="0.8"/>
    <text x="170" y="33" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#E8EDF5" text-anchor="middle" font-weight="600">⌨️  210+ Exercises • 40 Lessons</text>
  </g>
  <g transform="translate(100, 305)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#1A2140" opacity="0.8"/>
    <text x="170" y="33" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#E8EDF5" text-anchor="middle" font-weight="600">🎮  5 Interactive Typing Games</text>
  </g>
  <g transform="translate(100, 370)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#1A2140" opacity="0.8"/>
    <text x="170" y="33" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#E8EDF5" text-anchor="middle" font-weight="600">🎨  10 Professional Themes</text>
  </g>
  <g transform="translate(100, 435)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="52" rx="8" fill="#1A2140" opacity="0.8"/>
    <text x="170" y="33" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#E8EDF5" text-anchor="middle" font-weight="600">📊  Real-time Analytics & XP</text>
  </g>

  <!-- Right side: App mockup frame -->
  <g transform="translate(520, 80)">
    <!-- Window frame -->
    <rect x="0" y="0" width="680" height="480" rx="12" fill="#12172B" stroke="#1E2740" stroke-width="1"/>
    <!-- Window title bar -->
    <rect x="0" y="0" width="680" height="36" rx="12" fill="#0A0E1A"/>
    <rect x="0" y="20" width="680" height="16" fill="#0A0E1A"/>
    <!-- Window dots -->
    <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="40" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="60" cy="18" r="5" fill="#27C93F"/>
    <!-- Window content - sidebar -->
    <rect x="0" y="36" width="55" height="444" fill="#0D1225"/>
    <!-- Sidebar items -->
    <rect x="12" y="55" width="30" height="4" rx="2" fill="#4F8CFF" opacity="0.6"/>
    <rect x="12" y="70" width="30" height="4" rx="2" fill="#4F8CFF" opacity="0.3"/>
    <rect x="12" y="85" width="30" height="4" rx="2" fill="#4F8CFF" opacity="0.3"/>
    <rect x="12" y="100" width="30" height="4" rx="2" fill="#4F8CFF" opacity="0.3"/>
    <!-- Window content - main area -->
    <rect x="75" y="55" width="220" height="180" rx="8" fill="#1A2140"/>
    <rect x="75" y="250" width="585" height="12" rx="4" fill="#1A2140"/>
    <rect x="75" y="270" width="420" height="12" rx="4" fill="#1A2140"/>
    <rect x="75" y="290" width="500" height="12" rx="4" fill="#1A2140"/>
    <!-- Content boxes -->
    <rect x="310" y="55" width="180" height="80" rx="8" fill="#1A2140"/>
    <rect x="500" y="55" width="160" height="80" rx="8" fill="#1A2140"/>
    <rect x="310" y="145" width="350" height="90" rx="8" fill="#1A2140"/>
    <!-- Accent glow on mockup -->
    <rect x="310" y="55" width="180" height="80" rx="8" fill="#4F8CFF" opacity="0.08"/>
    <!-- Bottom stats bar -->
    <rect x="75" y="330" width="585" height="130" rx="8" fill="#1A2140"/>
    <rect x="100" y="355" width="100" height="40" rx="6" fill="#0A0E1A"/>
    <rect x="220" y="355" width="100" height="40" rx="6" fill="#0A0E1A"/>
    <rect x="340" y="355" width="100" height="40" rx="6" fill="#0A0E1A"/>
    <rect x="460" y="355" width="100" height="40" rx="6" fill="#0A0E1A"/>
    <!-- Text in stats boxes -->
    <text x="125" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4F8CFF" text-anchor="middle" font-weight="600">WPM</text>
    <text x="245" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#26C6A0" text-anchor="middle" font-weight="600">ACC</text>
    <text x="365" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#FFBD2E" text-anchor="middle" font-weight="600">XP</text>
    <text x="485" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#9B59B6" text-anchor="middle" font-weight="600">STREAK</text>
  </g>

  <!-- Tech stack bar -->
  <g transform="translate(0, 580)">
    <rect x="0" y="0" width="1280" height="60" fill="#0A0E1A" opacity="0.6"/>
    <text x="640" y="25" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8E98B3" text-anchor="middle" letter-spacing="4">BUILT WITH</text>
    <text x="640" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#E8EDF5" text-anchor="middle" letter-spacing="2">
      <tspan fill="#61DAFB">React 19</tspan>
      <tspan fill="#E8EDF5">  •  </tspan>
      <tspan fill="#3178C6">TypeScript</tspan>
      <tspan fill="#E8EDF5">  •  </tspan>
      <tspan fill="#FFC131">Tauri 2</tspan>
      <tspan fill="#E8EDF5">  •  </tspan>
      <tspan fill="#DE4C36">Rust</tspan>
      <tspan fill="#E8EDF5">  •  </tspan>
      <tspan fill="#06B6D4">Tailwind CSS</tspan>
      <tspan fill="#E8EDF5">  •  </tspan>
      <tspan fill="#003B57">SQLite</tspan>
    </text>
  </g>
</svg>
